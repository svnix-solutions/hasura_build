# Hasura GraphQL Engine v2 (Community Edition).
#
# Hasura has no embedded storage: it keeps its metadata in Postgres. This
# stack points at an EXISTING Postgres rather than shipping its own, so the
# metadata is covered by whatever backup job already protects that instance.
#
# Publishes nothing publicly by default -- the bind address defaults to
# loopback. It joins the shared "cloudflared" network so a reverse proxy or
# tunnel connector on the same host can reach it by container name.
#
# Multiple instances can share a host: set HASURA_CONTAINER_NAME and
# HASURA_PORT per deployment so the container names and published ports do not
# collide. Give each its own database too.

services:
  hasura:
    image: hasura/graphql-engine:${HASURA_VERSION:-v2.50.3-ce}
    # Parameterised so several regional instances can run on one host without
    # colliding. Set it per deployment, e.g. hasura-in / hasura-ae / hasura-ng.
    container_name: ${HASURA_CONTAINER_NAME:-hasura}
    restart: unless-stopped
    # List form, not map form: a bare "KEY" is passed through only when the
    # variable is actually set. That matters for
    # HASURA_GRAPHQL_UNAUTHORIZED_ROLE, which Hasura rejects as an empty string
    # ("empty string not allowed") and then crash-loops -- so it cannot simply
    # be defaulted to "".
    environment:
      # Metadata + default data source.
      - HASURA_GRAPHQL_DATABASE_URL=postgres://${HASURA_DB_USER:-hasura}:${HASURA_DB_PASSWORD:?HASURA_DB_PASSWORD is required}@${HASURA_DB_HOST:?HASURA_DB_HOST is required}:${HASURA_DB_PORT:-5432}/${HASURA_DB_NAME:-hasura}

      # Required. Without it the GraphQL API and console are UNAUTHENTICATED
      # and anyone who can reach the port has full admin rights.
      - HASURA_GRAPHQL_ADMIN_SECRET=${HASURA_ADMIN_SECRET:?HASURA_ADMIN_SECRET is required}

      - HASURA_GRAPHQL_ENABLE_CONSOLE=${HASURA_ENABLE_CONSOLE:-true}

      # Dev mode returns internal error details to API clients. Keep it off
      # anywhere the endpoint is reachable by anyone you do not trust.
      - HASURA_GRAPHQL_DEV_MODE=${HASURA_DEV_MODE:-false}

      - HASURA_GRAPHQL_ENABLED_LOG_TYPES=${HASURA_LOG_TYPES:-startup, http-log, webhook-log, websocket-log}
      - HASURA_GRAPHQL_CORS_DOMAIN=${HASURA_CORS_DOMAIN:-*}

      # Optional. Names the role given to requests that carry no auth. Leave it
      # unset and unauthenticated requests are rejected outright. Set it (e.g.
      # to "unauthorized") and they are evaluated as that role -- which grants
      # nothing until you define permissions for it in the console.
      - HASURA_GRAPHQL_UNAUTHORIZED_ROLE

      # Optional. When set, Hasura keeps its METADATA here and treats
      # HASURA_GRAPHQL_DATABASE_URL purely as a data source. Leave it unset and
      # both live in the one database, which is fine for a single-database
      # deployment but not when the schema is owned by a migrations repo -- you
      # do not want hdb_catalog inside the database those migrations rebuild.
      - HASURA_GRAPHQL_METADATA_DATABASE_URL

      # Optional. Base URL actions resolve their handlers against. Metadata
      # exported from another environment carries relative handlers, so without
      # this every action is reported inconsistent.
      - HASURA_GRAPHQL_ACTIONS_HANDLER_WEBHOOK_BASEURL

      # Optional. JSON service account for a BigQuery source. A metadata set
      # that declares one is inconsistent until this is present.
      - HASURA_GRAPHQL_BIGQUERY_SA_ACCOUNT

      # Optional. JWT verification config. Unset means admin-secret-only auth.
      - HASURA_GRAPHQL_JWT_SECRET

    # Defaults to loopback. Set HASURA_BIND to a LAN address for direct access.
    ports:
      - "${HASURA_BIND:-127.0.0.1}:${HASURA_PORT:-8080}:8080"

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

    networks:
      - tunnel
      - default

networks:
  # Shared with the tunnel connector / reverse proxy on this host, so they can
  # reach the container by name. Create it once: docker network create cloudflared
  tunnel:
    external: true
    name: ${CLOUDFLARE_TUNNEL_NETWORK:-cloudflared}
